# test/vectors/policy/classes.yaml — decision table for spec/05
# transactions §1 ordered reversibility classes and §2 strictest
# condition (M5.2). At least 250 rows.
#
# The expected column was derived by reasoning from the spec text
# (05 §1 rules 1-10, §2 strictest-wins, the rule-2 declared_safe flag),
# never by running the Go classifier or the Python reference:
# test/gen/classes_table.py contains an independent expression of the
# rules and this file was reviewed by reading after generation.
#
# Row format: {name, policy, grant, request, taint?, c523?,
#   expected:{class, requires, declared_safe}}. The row's request
# additionally passes through 04 §2 grant selection and must select the
# named grant; class is that of the effect, requires the condition
# imposed (allow|intent|review|deny), declared_safe the §1 rule-2 flag.
# Rows with c523 assert the autonomy table wins against a looser grant
# requires (C5.2.3).
# invalid entries: {name, field, policy} — policy.Load must reject with
# an error naming field (C5.2.2).
policies:
  base: |
    apiVersion: "countersign.dev/v1alpha1"
    kind: "SessionPolicy"
    metadata: {name: "t"}
    spec:
      mode: "enforce"
      scenario: "agent"
      grants:
        - {id: "llm", match: {hosts: ["api.anthropic.test"], methods: ["POST"]}, inspect: "inference"}
        - {id: "boundary-decl", match: {hosts: ["countersign.internal"], paths: ["/decl/**"]}, class: "safe"}
        - {id: "boundary", match: {hosts: ["countersign.internal"], ports: [443, 8443]}}
        - {id: "repo", match: {hosts: ["code.test"], matcher: {git-smart-http: {repos: ["acme/widgets", "acme/lib"], access: "write"}}}, stager: {git: {refs: ["refs/heads/agent/*"], allowDelete: false, allowNonFastForward: false, maxPackBytes: "512Mi"}}}
        - {id: "repo-ro", match: {hosts: ["ro.test"], matcher: {git-smart-http: {repos: ["acme/widgets"], access: "read"}}}}
        - {id: "repo-nows", match: {hosts: ["ws.test"], matcher: {git-smart-http: {repos: ["acme/widgets", "acme/lib"], access: "write"}}}}
        - {id: "api", match: {hosts: ["api.test"]}}
        - {id: "api-meth", match: {hosts: ["m.test"], methods: ["GET", "HEAD", "OPTIONS", "POST", "PUT", "DELETE", "PATCH", "TRACE", "PURGE"]}}
        - {id: "ws", match: {hosts: ["rt.test"], methods: ["GET"], paths: ["/feed"]}, upgrade: ["websocket"]}
        - {id: "pt", match: {hosts: ["vpn.test"]}, mode: "passthrough"}
        - {id: "mcp-map", match: {hosts: ["mcp.map.test"], methods: ["POST", "GET"]}, inspect: "mcp", tools: {search: "safe", issue: "irreversible", note: "compensable", halt: "control"}}
        - {id: "mcp-ser", match: {hosts: ["mcp.ser.test"], methods: ["POST", "GET"]}, inspect: "mcp", calls: "serialized"}
        - {id: "mcp-bare", match: {hosts: ["mcp.bare.test"], methods: ["POST"]}, inspect: "mcp"}
        - {id: "notify", match: {hosts: ["chat.test"], methods: ["POST", "PUT", "DELETE"], paths: ["/api/messages"]}, stager: {outbox: {respond: {status: 200, contentType: "application/json", body: "{\"ok\": true, \"id\": \"{provisional}\"}"}, idMap: {provisional: "/id", real: "/id"}, idempotencyHeader: "Idempotency-Key"}}}
        - {id: "ob-read", match: {hosts: ["chat.test"], methods: ["GET", "HEAD"], paths: ["/api/messages"]}, stager: {outbox: {respond: {status: 200, contentType: "application/json", body: "{\"ok\": true, \"id\": \"{provisional}\"}"}, idMap: {provisional: "/id", real: "/id"}, idempotencyHeader: "Idempotency-Key"}}}
        - {id: "comp-put", match: {hosts: ["c.test"], methods: ["GET", "PUT", "PATCH", "POST", "DELETE"], paths: ["/things/**"]}, compensate: {restore: {methods: ["PUT", "PATCH"]}, stateDigest: {ignore: ["/updated_at"]}}}
