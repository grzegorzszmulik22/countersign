policies:
  main: |
    apiVersion: "countersign.dev/v1alpha1"
    kind: "SessionPolicy"
    metadata: {name: "main"}
    spec:
      mode: "enforce"
      scenario: "agent"
      grants:
        - {id: "deny-admin", match: {hosts: ["api.example.com"], paths: ["/admin/**"]}, action: "deny"}
        - {id: "api-read", match: {hosts: ["api.example.com"], methods: ["GET", "HEAD"], paths: ["/v1/**", "/v*/items"]}}
        - {id: "api-write", match: {hosts: ["api.example.com"], methods: ["POST", "PUT"], paths: ["/v1/items", "/v1/items/*/comments"]}}
        - {id: "wild-pub", match: {hosts: ["*.example.com"], methods: ["GET"], paths: ["/pub/**"]}}
        - {id: "api-any", match: {hosts: ["api.example.com"]}}
  order-a: |
    apiVersion: "countersign.dev/v1alpha1"
    kind: "SessionPolicy"
    metadata: {name: "order-a"}
    spec:
      mode: "enforce"
      scenario: "agent"
      grants:
        - {id: "broad", match: {hosts: ["shop.test"], paths: ["/**"]}}
        - {id: "narrow", match: {hosts: ["shop.test"], methods: ["POST"]}}
  order-b: |
    apiVersion: "countersign.dev/v1alpha1"
    kind: "SessionPolicy"
    metadata: {name: "order-b"}
    spec:
      mode: "enforce"
      scenario: "agent"
      grants:
        - {id: "narrow", match: {hosts: ["shop.test"], methods: ["POST"]}}
        - {id: "broad", match: {hosts: ["shop.test"], paths: ["/**"]}}
  deny-first: |
    apiVersion: "countersign.dev/v1alpha1"
    kind: "SessionPolicy"
    metadata: {name: "deny-first"}
    spec:
      mode: "enforce"
      scenario: "agent"
      grants:
        - {id: "deny-x", match: {hosts: ["svc.test"], paths: ["/x/**"]}, action: "deny"}
        - {id: "allow-x", match: {hosts: ["svc.test"], paths: ["/x/**"]}}
  deny-last: |
    apiVersion: "countersign.dev/v1alpha1"
    kind: "SessionPolicy"
    metadata: {name: "deny-last"}
    spec:
      mode: "enforce"
      scenario: "agent"
      grants:
        - {id: "allow-x", match: {hosts: ["svc.test"], paths: ["/x/**"]}}
        - {id: "deny-x", match: {hosts: ["svc.test"], paths: ["/x/**"]}, action: "deny"}
  schemes: |
    apiVersion: "countersign.dev/v1alpha1"
    kind: "SessionPolicy"
    metadata: {name: "schemes"}
    spec:
      mode: "enforce"
      scenario: "agent"
      grants:
        - {id: "secure", match: {hosts: ["secure.test"]}}
        - {id: "plain", match: {hosts: ["insecure.test"], scheme: "http"}}
        - {id: "both-p", match: {hosts: ["multi.test"], ports: [443, 8443]}}
        - {id: "p8443", match: {hosts: ["alt.test"], ports: [8443]}}
        - {id: "httpx", match: {hosts: ["odd.test"], scheme: "http", ports: [8080]}}
  ip: |
    apiVersion: "countersign.dev/v1alpha1"
    kind: "SessionPolicy"
    metadata: {name: "ip"}
    spec:
      mode: "enforce"
      scenario: "agent"
      grants:
        - {id: "ipgrant", match: {hosts: ["203.0.113.7"]}}
        - {id: "ipwild", match: {hosts: ["*.example.com"]}}
        - {id: "v6", match: {hosts: ["::1"]}}
  idn: |
    apiVersion: "countersign.dev/v1alpha1"
    kind: "SessionPolicy"
    metadata: {name: "idn"}
    spec:
      mode: "enforce"
      scenario: "agent"
      grants:
        - {id: "idn", match: {hosts: ["xn--nxasmq6b.example", "xn--bcher-kva.test"]}}
  pass: |
    apiVersion: "countersign.dev/v1alpha1"
    kind: "SessionPolicy"
    metadata: {name: "pass"}
    spec:
      mode: "enforce"
      scenario: "agent"
      grants:
        - {id: "tunnel", match: {hosts: ["vpn.test"]}, mode: "passthrough"}
  star: |
    apiVersion: "countersign.dev/v1alpha1"
    kind: "SessionPolicy"
    metadata: {name: "star"}
    spec:
      mode: "enforce"
      scenario: "agent"
      grants:
        - {id: "any", match: {hosts: ["*"]}}
  learn: |
    apiVersion: "countersign.dev/v1alpha1"
    kind: "SessionPolicy"
    metadata: {name: "learn"}
    spec:
      mode: "learn"
      scenario: "agent"
      grants:
        - {id: "any-cred", match: {hosts: ["*"]}, credential: {ref: {secret: "s", key: "k"}, inject: {header: "x-api-key"}, placeholderEnv: "X_KEY"}}
  gitlike: |
    apiVersion: "countersign.dev/v1alpha1"
    kind: "SessionPolicy"
    metadata: {name: "gitlike"}
    spec:
      mode: "enforce"
      scenario: "agent"
      grants:
        - {id: "repo", match: {hosts: ["code.test"], methods: ["GET"], paths: ["/repos/acme/widgets", "/repos/acme/*/info/refs"]}}
        - {id: "repog", match: {hosts: ["code.test"], methods: ["POST"], paths: ["/repos/acme/*"]}}
  empty-lists: |
    apiVersion: "countersign.dev/v1alpha1"
    kind: "SessionPolicy"
    metadata: {name: "empty-lists"}
    spec:
      mode: "enforce"
      scenario: "agent"
      grants:
        - {id: "e-methods", match: {hosts: ["em.test"], methods: []}}
        - {id: "e-paths", match: {hosts: ["ep.test"], paths: []}}
        - {id: "e-ports", match: {hosts: ["epo.test"], ports: []}}
        - {id: "e-ok", match: {hosts: ["e.test"]}}
