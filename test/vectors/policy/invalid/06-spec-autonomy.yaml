# field: spec.autonomy
# rule: the intent condition is rejected at validation until M9 (05 §2)
apiVersion: "countersign.dev/v1alpha1"
kind: "SessionPolicy"
metadata: {name: bad}
spec:
  mode: "enforce"
  scenario: "agent"
  autonomy: {safe: "intent"}
  grants:
    - {id: g1, match: {hosts: ["api.example.com"]}}
