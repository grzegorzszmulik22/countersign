# field: spec.grants[0].match.hosts
# rule: "*" alone is rejected on a credentialed grant unless spec.mode is learn
apiVersion: "countersign.dev/v1alpha1"
kind: "SessionPolicy"
metadata: {name: bad}
spec:
  mode: "enforce"
  scenario: "agent"
  grants:
    - {id: g1, match: {hosts: ["*"]},
       credential: {ref: {secret: s, key: k}, inject: {header: "x-api-key"}, placeholderEnv: "X_KEY"}}
