# field: stager
# rule: a git stager without a refs list is invalid (05 §4; M5.2 validation)
apiVersion: "countersign.dev/v1alpha1"
kind: "SessionPolicy"
metadata: {name: bad}
spec:
  mode: "enforce"
  scenario: "agent"
  grants:
    - {id: g1, match: {hosts: ["api.example.com"]}, stager: {git: {}}}
