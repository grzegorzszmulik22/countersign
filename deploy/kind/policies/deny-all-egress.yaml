#
# Deny-all egress NetworkPolicy: selects every pod in the namespace it is
# applied to and permits no outbound traffic. Used by the C0.2.1 proof that
# the CNI really enforces NetworkPolicy; M4.3 builds the generated lockdown on
# the same shape.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
